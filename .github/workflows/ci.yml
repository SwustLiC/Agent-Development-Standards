name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown:
    name: Markdown 风格
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查 Markdown
        run: npx -y markdownlint-cli2 "**/*.md"

  canary:
    name: canary 项目 (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/mini
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: 安装依赖
        run: uv sync
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing
      - name: scripts (ruff + mypy)
        working-directory: .
        run: |
          uv run --project examples/mini ruff check --config examples/mini/pyproject.toml scripts
          uv run --project examples/mini ruff format --check --config examples/mini/pyproject.toml scripts
          uv run --project examples/mini mypy --config-file examples/mini/pyproject.toml scripts

  scripts:
    name: 接入脚本冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: reference.py
        run: |
          python scripts/reference.py target-ref
          test -f target-ref/opencode.json
          test -f target-ref/AGENTS.md
          test -f target-ref/pyproject.toml
          grep -q "standards/python/core.md" target-ref/opencode.json
      - name: vendor.py
        run: |
          python scripts/vendor.py target-vendor
          python scripts/vendor.py target-vendor
          test -f target-vendor/.opencode/standards/python/core.md
          test -f target-vendor/opencode.json
          test -f target-vendor/AGENTS.md
          python - <<'PY'
          import json
          cfg = json.loads(open("target-vendor/opencode.json", encoding="utf-8").read())
          assert ".opencode/standards/python/core.md" in cfg["instructions"]
          assert cfg["references"]["python-standards"]["path"] == "./.opencode/standards/python"
          assert cfg["formatter"] is True
          print("vendor opencode.json 合并结果正确")
          PY
      - name: vendor.py 配置合并与 --gitignore
        run: |
          mkdir -p target-merge
          printf '%s\n' '{"instructions":["standards/python/core.md","custom.md"],"references":{"python-standards":{"repository":"old/repo","branch":"dev"}}}' > target-merge/opencode.json
          python scripts/vendor.py target-merge --gitignore
          grep -qx ".opencode/standards/python/" target-merge/.gitignore
          python - <<'PY'
          import json
          cfg = json.loads(open("target-merge/opencode.json", encoding="utf-8").read())
          assert cfg["instructions"] == ["custom.md", ".opencode/standards/python/core.md"]
          ref = cfg["references"]["python-standards"]
          assert ref["path"] == "./.opencode/standards/python"
          assert "repository" not in ref and "branch" not in ref
          print("旧配置迁移结果正确")
          PY
