# canary 样例项目：应用 standards/python/ 全部规范，用于验证规范可落地。
# CI（.github/workflows/ci.yml）会对本项目跑 ruff / mypy / pytest。

[project]
name = "mini"
version = "0.1.0"
description = "Canary 样例项目：验证 standards/python 规范可落地。"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: 错误
    "W",   # pycodestyle: 警告
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff 专属规则
]

# 中文文档约定（见 standards/python/code-style.md）：
# 忽略歧义 unicode 字符检查，允许字符串/docstring/注释使用全角标点。
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pytest"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: 慢速测试（用 -m 'not slow' 跳过）",
    "integration: 需要外部服务的集成测试",
]

[tool.coverage.run]
branch = true
source = ["mini"]
